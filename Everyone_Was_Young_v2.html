service:['잠시 멈춘다고 인생까지 멈추는 건 아니야.','계획대로 흘러가지 않는 시간이 두렵다. 이 공백을 어떻게 보낼까?'],

crush:{'용기 내어 만나자고 한다':'두 사람은 주말에 카페에서 만났다. 헤어질 무렵 다음 만남을 약속했다.','친구로 지낸다':'연애로 서두르지 않고 편안한 관계를 이어가기로 했다.','지금은 내 일에 집중한다':'메시지에 답장을 보냈다. 마음 한구석에는 아쉬움이 남았지만 지금은 목표를 택했다.'},
graduation:{'기업 취업을 준비한다':'채용 공고를 모으고 이력서를 고쳐 쓰기 시작했다.','대학원에 진학한다':'합격 소식을 들은 날, 연구실의 새로운 책상을 배정받았다.','공공기관 시험을 준비한다':'계획표를 새로 만들었다. 매일 비슷한 시간에 책상 앞에 앉았다.','졸업 후 잠시 쉬어 간다':'졸업장을 받아 들고 조금 멈춰 서기로 했다. 누구도 내 속도를 대신 정할 수는 없었다.'},
recruit:{'기업에 입사한다':'합격 전화가 왔다. 첫 출근 날짜를 확인하고 셔츠를 준비했다.','작은 회사에서 먼저 경험을 쌓는다':'작은 사무실에서 첫 프로젝트를 맡았다. 기대했던 회사는 아니었지만 배울 일이 많았다.','공부를 계속해 다음을 노린다':'다시 책상 앞에 앉았다. 막막한 순간에도 이전 지원서의 부족한 부분을 하나씩 고쳤다.','프리랜서로 시작한다':'첫 의뢰를 받았다. 수입은 일정하지 않았지만 내 이름으로 일을 시작했다.'},
proposal:{'결혼을 결정한다':'양가와 이야기를 나누고 함께 살 공간을 준비했다. 행복과 동시에 새로운 책임이 시작됐다.','결혼 없이 관계를 이어간다':'서로의 생활비와 공간, 앞으로의 약속을 솔직하게 정했다.','서로의 길을 놓아준다':'함께 찍은 사진을 서랍에 넣었다. 사랑했던 시간이 사라지지는 않았다.'},
career30:{'전문가의 길을 택한다':'남들이 어려워하던 일을 하나씩 해결했다. 어느새 동료들이 조언을 구하기 시작했다.','관리자 역할에 도전한다':'팀의 성과와 실수를 함께 책임지게 되었다. 내 일만 잘하는 것과는 달랐다.','독립 사업을 시작한다':'사업자등록증을 받아 들고 작은 사무실의 문을 열었다. 월급 대신 매출을 기다리는 날들이 시작됐다.','안정과 균형을 선택한다':'퇴근 후에는 일이 아닌 다른 약속을 달력에 채우기 시작했다.'},
parent:{'아이를 키우기로 한다':'작은 옷과 필요한 물건을 준비했다. 앞으로의 생활비와 시간을 다시 계획했다.','아이 없이 함께 산다':'두 사람이 원하는 일상을 구체적으로 그려 보았다. 다른 방식의 가족도 충분히 의미 있었다.','조금 더 시간을 갖는다':'서두르지 않고 각자의 고민을 더 듣기로 했다. 이 질문은 몇 해 뒤 다시 찾아올 수 있다.'},
repair:{'시간을 내어 솔직히 대화한다':'오래 마음에 담아 둔 말들을 꺼냈다. 완벽한 해결은 아니었지만 서로의 목소리를 다시 듣기 시작했다.','상담이나 중재를 받는다':'제삼자의 도움으로 반복되던 갈등을 다른 방식으로 바라보게 됐다.','각자의 삶으로 돌아간다':'함께 쓰던 공간과 일상을 정리했다. 익숙했던 삶은 끝났지만 다시 시작할 수 있었다.'},
healthcheck:{'운동과 수면을 바꾼다':'작은 운동부터 시작했다. 앞으로의 건강 변화에 꾸준한 습관이 영향을 줄 것이다.','바쁠 때가 지나면 한다':'검사지를 책상 서랍에 넣었다. 몸의 신호는 아직 사라지지 않았다.','검진 후 필요한 치료를 받는다':'다음 진료 날짜를 달력에 적고 일정을 조정했다.'},
retire:{'은퇴하고 일상을 즐긴다':'평일 아침에 알람을 끄고 천천히 차를 끓였다. 더 이상 출근하지 않아도 되는 하루였다.','파트타임이나 자문을 한다':'쌓아 온 경험을 필요로 하는 사람들과 적당한 시간만 일하기로 했다.','새로운 사회 활동을 시작한다':'명함 대신 내 이름을 소개했다. 일터 밖에서 새로운 역할을 찾기 시작했다.'},
last93:{'눈을 감고 지난날을 떠올린다':'스무 살의 방, 수많은 만남과 헤어짐, 평범했던 저녁들이 차례로 스쳐 갔다. 모두 나의 인생이었다.'}
};
const $=id=>document.getElementById(id), STORE='ewy-save-v1', names={cash:'자산',skill:'역량',bond:'관계',health:'건강',heart:'마음'}, colors={cash:'#bda375',skill:'#91aabd',bond:'#a2b9a3',health:'#78a795',heart:'#c2a99a'}, careers={office:'기업 직장인',trade:'실무·기술직',public:'공공기관',business:'사업가',freelance:'프리랜서',search:'구직·전환기',grad:'대학원 연구',undefined:'진로 탐색'}, routes={uni:'대학 진학',work:'사회생활 시작',gap:'진로 탐색'};let state=null, screen='title', toastTimer;const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const val=(x,s=state)=>typeof x==='function'?x(s):x;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const fmt=n=>n.toLocaleString('ko-KR');const chapter=age=>age<30?'제1장 · 가능성의 계절':age<40?'제2장 · 내 삶을 짓다':age<60?'제3장 · 깊어지는 시간':age<75?'제4장 · 느린 오후':'제5장 · 마지막 페이지';
function notify(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,1800)}
function writeSave(quiet=true){if(!state)return;try{localStorage.setItem(STORE,JSON.stringify(state));if(!quiet)notify('현재 인생을 저장했어요.')}catch(e){if(!quiet)notify('자동 저장을 사용할 수 없어요. 파일 저장을 이용하세요.')}}
function readSave(){try{let s=JSON.parse(localStorage.getItem(STORE));return validSave(s)?s:null}catch(e){return null}}
function validSave(s){return !!(s&&s.version===1&&Number.isInteger(s.index)&&s.index>=0&&s.index<=events.length&&Number.isInteger(s.age)&&s.age>=20&&s.age<=93&&['choice','result','ended'].includes(s.phase)&&s.flags&&Array.isArray(s.history)&&['cash','skill','bond','health','heart'].every(k=>Number.isFinite(s[k]))&&Number.isInteger(s.seed));}
function rng(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296}
function newLife(name,avatar={...avatarDefault}){state={version:1,avatar,name:name.trim().slice(0,18)||'나',age:20,index:0,phase:'choice',cash:650,skill:30,bond:35,health:78,heart:55,flags:{},history:[],seed:(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0,death:null,result:null,skipped:0};screen='game';closePanel();writeSave();render()}
function showTitle(){screen='title';$('tools').hidden=true;let s=readSave();$('game').innerHTML=`<div class="startscreen"><div class="titlebg">${bgArt('campus')}</div><div class="titlecard"><div class="eyebrow">A LIFE IN CHOICES · 01</div><h1>Everyone<br>Was <em>Young.</em></h1><h2>모두가 청년이었다</h2><p>스무 살, 세상은 아직 정해지지 않았다.<br>어떤 길을 걷든, 당신만의 이야기가 된다.</p><div class="startbuttons"><button class="primary" id="newBtn">새로운 인생 시작</button>${s?`<button class="mini" id="resumeBtn">이어하기 · ${esc(s.name)} (${s.age}세${s.phase==='ended'?' · 완결':''})</button>`:''}<button class="mini" id="loadBtn">저장 파일 불러오기</button><button class="mini" id="helpBtn">게임 방법</button></div><div class="tiny" style="margin-top:18px">ORIGINAL LIFE SIMULATION · ${events.length} SCENES · VER. 2.0 · THE LIFE CHRONICLE</div></div></div>`;$('newBtn').onclick=startDialog;if(s)$('resumeBtn').onclick=()=>{state=s;screen='game';render()};$('loadBtn').onclick=()=>$('importFile').click();$('helpBtn').onclick=help}
function openPanel(html){$('panel').classList.remove('custompanel');$('panel').innerHTML=html;$('overlay').hidden=false;const b=$('closePanel');if(b)b.onclick=closePanel}function closePanel(){$('overlay').hidden=true}
function startDialog(){creatorDialog(false)}
function help(){openPanel(`<div class="panelhead"><h2>살아가는 방법</h2><button class="mini" id="closePanel">닫기</button></div><p>20세부터 삶의 마지막까지 한 장면씩 선택합니다. A/B/C/D 중 한 가지를 선택하면 자산·역량·관계·건강·마음과 이후에 등장하는 장면이 달라집니다.</p><p>과거 선택으로 조건을 만족한 선택지만 나타납니다. 예를 들어 MT와 동아리는 새 인연을 만들고, 혼자 공부하면 장학금이나 전문성에 유리할 수 있습니다. 관계가 없으면 일부 장면은 아예 나타나지 않습니다.</p><p>나이가 들면 수입·생활비·건강 변화가 자동 반영됩니다. 일정 나이부터 생의 마지막이 찾아올 수 있으며, 건강이 좋더라도 수명이 정해져 있지는 않습니다. 게임 수치는 현실 예측 모델이 아닙니다.</p><p>키보드 A–D 또는 1–4로 선택, Enter로 다음 장면. 매 선택은 자동 저장되고, 메뉴에서 저장 파일을 내보낼 수 있습니다.</p>`)}
function apply(delta){let result={};for(let [k,v] of Object.entries(delta)){if(!(k in names))continue;let old=state[k];state[k]=k==='cash'?Math.round(state[k]+v):clamp(state[k]+v,0,100);result[k]=state[k]-old}return result}
function yearTick(){const s=state;let inc=0;if(s.flags.retired||s.age>=65)inc=s.flags.consult?150:s.flags.retireReady?70:-80;else if(employed(s))inc=({office:250,public:230,trade:190,business:s.flags.businessStrong?470:80,freelance:130})[s.flags.career]||100;else inc=-100;if(s.flags.child&&s.age<52)inc-=90;if(s.flags.debt)inc-=75;if(s.flags.frugal||s.flags.saving)inc+=55;if(s.flags.side&&s.age<60)inc+=65;if(s.flags.partner&&s.age<65)inc+=25;s.cash+=inc;let wear=s.age<40?0:s.age<55?1:s.age<70?2:s.age<80?3:5;if(s.flags.exercise)wear=Math.max(0,wear-1);if(s.flags.checkup||s.flags.care)wear=Math.max(0,wear-1);s.health=clamp(s.health-wear,0,100);if(s.flags.community||s.flags.hobby||s.flags.partner){if(s.age%3===0)s.heart=clamp(s.heart+1,0,100)}else if(s.age>=60&&s.age%3===0)s.bond=clamp(s.bond-1,0,100);if(s.cash<0&&s.age%2===0)s.heart=clamp(s.heart-2,0,100);
if(s.age>=50&&s.health<=0)return '오랜 시간 몸이 감당해 온 부담 속에서 삶의 마지막을 맞았다.';if(s.age>=72){let chance=(s.age-70)*.004+(100-s.health)*.0007+(s.age>=85?.035:0);if(rng(s)<chance)return '계절이 바뀌는 어느 날, 살아온 모든 시간이 한 편의 이야기로 남았다.'}return null}
function finish(reason){state.phase='ended';state.death=reason;state.result=null;writeSave();render()}
function advance(){let s=state;for(let i=s.index+1;i<events.length;i++){let e=events[i];while(s.age<e.age){s.age++;let death=yearTick();if(death){finish(death);return}}if(e.cond&&!e.cond(s)){s.skipped++;continue}if(!e.choices.some(c=>!c.cond||c.cond(s))){s.skipped++;continue}s.index=i;s.phase='choice';s.result=null;writeSave();render();return}finish('스무 살에서 시작한 길이 삶의 마지막 페이지에 닿았다.')}
function choose(i){if(screen!=='game'||state.phase!=='choice'||!$('overlay').hidden)return;const e=events[state.index], options=e.choices.filter(c=>!c.cond||c.cond(state)), c=options[i];if(!c)return;let delta={...c.delta}, special='';if(e.id==='investresult'&&state.flags.invest==='risk'){let gain=rng(state)<.43?2100:-750;delta.cash=(delta.cash||0)+gain;special=gain>0?' 시장의 반등으로 큰 수익을 얻었다.':' 시장이 하락해 투자금 일부를 잃었다.'}if(e.id==='investresult'&&state.flags.invest==='safe'){delta.cash=(delta.cash||0)+550;special=' 분산 투자에서 꾸준한 수익이 발생했다.'}if(e.id==='crush')state.flags.crushSeen=true;if(e.id==='start')state.flags.origin=c.set.route;let effects=apply(delta);Object.assign(state.flags,c.set);let outcome=c.result||(outcomes[e.id]||{})[c.label]||`${c.desc} 시간이 지나며 그 선택은 내 일상의 일부가 되었다.`;if(e.id==='mt'&&c.set.mt===false)outcome+=(c.set.jimin?' 모든 모임에 참여하지 않아도 누군가와 연결될 수 있었다.':' MT에서 생길 수 있었던 몇 가지 관계는 내 인생에 등장하지 않게 되었다.');if(e.id==='scholarship')outcome+=' 혼자 쌓아 온 시간도 분명히 의미가 있었다.';if(e.id==='offer')outcome+=' 과거에 이어 두었던 관계가 지금의 선택지를 만들었다.';outcome+=special;state.history.push({age:state.age,id:e.id,title:e.title,choice:c.label,outcome});state.result={outcome,effects,choice:c.label};state.phase='result';writeSave();render()}
function stats(){return `<div class="status"><div class="agebox"><b>${state.age}</b><span>세</span><small>${esc(state.name)}의 인생</small></div><div class="statgrid">${Object.entries(names).map(([k,n])=>`<div><div class="stathead"><span>${n}</span><b>${k==='cash'?fmt(state.cash)+'만':state[k]}</b></div><div class="track"><i style="background:${colors[k]};width:${k==='cash'?clamp(state.cash/10000*100,0,100):state[k]}%"></i></div></div>`).join('')}</div></div><div class="lifeprogress"><i style="width:${(state.age-20)/73*100}%"></i></div>`}
function render(){renderV2()}
function renderEnd(){const s=state, f=s.flags;let ending=s.heart>=80&&s.bond>=70?'따뜻한 연결의 삶':s.skill>=85&&s.cash>=6000?'도전이 쌓인 삶':s.heart>=80?'나의 속도로 살아낸 삶':s.bond>=65?'사람으로 이어진 삶':s.health>=65?'오래, 단단하게 걸은 삶':'수많은 계절을 건넌 삶';const status=f.partner?`${f.partner}와의 동행`:'자신만의 여정';const letter=f.letter||'모든 순간이 완벽하지는 않았지만, 그 모든 순간이 나였다.';$('game').innerHTML=`${stats()}<div class="endcard"><div class="eyebrow tiny">THE LAST PAGE · FIN</div><h1>${esc(ending)}</h1><p class="quote">${esc(s.name)}, ${s.age}세.<br>${esc(s.death)}</p><p style="color:#61796e">“${esc(letter)}”</p><div class="endgrid"><div class="endcell">출발<b>${esc(routes[f.origin||f.route]||'나의 길')}</b></div><div class="endcell">커리어<b>${esc(careers[f.career]||'나만의 일')}</b></div><div class="endcell">동행<b>${esc(status)}</b></div><div class="endcell">가족<b>${f.child?'아이와 함께한 기억':'다양한 관계의 기억'}</b></div><div class="endcell">남긴 것<b>${esc(f.legacy||(f.mentorLegacy?'후배에게 전한 경험':f.hobby?'좋아하던 일':'살아온 시간'))}</b></div><div class="endcell">선택한 순간<b>${s.history.length}개</b></div></div><p class="tiny">선택하지 않은 장면과 만나지 못한 사람도 있었습니다. 다른 인생은 또 다른 이야기입니다.</p><div class="endbuttons"><button class="primary" id="endJournal">나의 일대기 보기</button><button class="mini" id="againBtn">다른 인생 시작</button><button class="mini" id="endSave">기록 저장</button></div></div>`;$('endJournal').onclick=journal;$('againBtn').onclick=startDialog;$('endSave').onclick=exportSave}
function journal(){if(!state)return;let f=state.flags;openPanel(`<div class="panelhead"><h2>${esc(state.name)}의 일대기</h2><button class="mini" id="closePanel">닫기</button></div><p>${state.age}세 · ${state.history.length}번의 선택 · ${esc(careers[f.career]||'진로 탐색')} ${f.partner?'· '+esc(f.partner)+'와 동행':''}</p>${state.history.length?state.history.map(h=>`<div class="historyrow"><b>${h.age}세</b><div><strong>${esc(h.title)}</strong><small>${esc(h.choice)}</small><small>${esc(h.outcome)}</small></div></div>`).join(''):'<p>아직 첫 선택을 하지 않았어요.</p>'}`)}
function exportSave(){if(!state)return;let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Everyone_Was_Young_${state.age}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('인생 기록 파일을 내보냈어요.')}
function menu(){openPanel(`<div class="panelhead"><h2>메뉴</h2><button class="mini" id="closePanel">닫기</button></div><p>현재 인생은 매 선택마다 자동으로 저장됩니다.</p><div class="startbuttons"><button class="primary" id="returnBtn">인생 계속하기</button><button class="mini" id="exportBtn">저장 파일 내보내기</button><button class="mini" id="importBtn">저장 파일 불러오기</button><button class="mini" id="titleBtn">타이틀 화면</button><button class="mini" id="newLifeBtn">새 인생 시작</button><button class="mini" id="avatarBtn">외형 수정</button><button class="mini" id="settingsBtn">게임 설정</button><button class="mini" id="howBtn">게임 방법</button></div>`);$('returnBtn').onclick=closePanel;$('exportBtn').onclick=exportSave;$('importBtn').onclick=()=>$('importFile').click();$('titleBtn').onclick=()=>{writeSave();closePanel();showTitle()};$('newLifeBtn').onclick=startDialog;$('howBtn').onclick=help;$('avatarBtn').onclick=()=>creatorDialog(true);$('settingsBtn').onclick=settingPanel}
$('journalBtn').onclick=journal;$('statusBtn').onclick=summaryPanel;$('peopleBtn').onclick=relations;$('saveBtn').onclick=()=>{writeSave(false)};$('menuBtn').onclick=menu;$('overlay').onclick=e=>{if(e.target===$('overlay'))closePanel()};$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let s=JSON.parse(await file.text());if(!validSave(s))throw Error();state=s;closePanel();writeSave();render();notify('기록을 불러왔어요.')}catch(err){notify('올바른 게임 저장 파일이 아닙니다.')}e.target.value=''};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();return}if(screen!=='game'||!state||!$('overlay').hidden||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.repeat)return;if(state.phase==='choice'){let i='abcd'.indexOf(e.key.toLowerCase());if(i<0)i='1234'.indexOf(e.key);if(i>=0){e.preventDefault();choose(i)}}else if(state.phase==='result'&&e.key==='Enter'){e.preventDefault();advance()}});showTitle();

</script></body></html>
